<style>
/* Layout: one working column on phones (form, then the chart); on wide screens the form sits left of a large chart. */
:root {
  --bg: #EFF7F6;          /* mint, as the 見微 start screen */
  --card: #FFFFFF;
  --ink: #1D2B2C;
  --muted: #5E7273;
  --line: #CFE1DF;
  --accent: #0097A7;      /* 見微 teal */
  --accent-ink: #FFFFFF;
  --soft: #DDF0EE;
  --warn: #B3261E;
  --chart-paper: #FFFFFF;
  --f-ui: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-chart: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141B1C; --card: #1F2829; --ink: #E4EEED; --muted: #9DB2B1; --line: #33413F; --accent: #3FB8C4; --accent-ink: #0B1A1C; --soft: #23393A; --warn: #F2B8B5; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #141B1C; --card: #1F2829; --ink: #E4EEED; --muted: #9DB2B1; --line: #33413F; --accent: #3FB8C4; --accent-ink: #0B1A1C; --soft: #23393A; --warn: #F2B8B5; color-scheme: dark; }

body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 980px) { .wrap { grid-template-columns: 340px minmax(0, 1fr); align-items: start; } .form-card { position: sticky; top: 14px; grid-column: 1; grid-row: 2; } .chart-card { grid-column: 2; grid-row: 2; } }
header.top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
header.top h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
header.top .sub { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border-radius: 14px; border: 1px solid var(--line); }
.form-card { padding: 16px; display: grid; gap: 12px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row > label.lbl { width: 40px; flex: none; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], select { font: inherit; font-size: 16px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.grow { flex: 1 1 0; width: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.seg { flex: none; }
.w-year { width: 72px; } .w-small { width: 50px; } .w-time { width: 76px; } .w-lon { width: 96px; }
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; }
.seg button { font: inherit; border: 0; background: transparent; color: var(--accent); padding: 5px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.pill { font: inherit; font-size: 14px; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.go { font: inherit; font-size: 17px; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; flex: 1; }
.hint { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.err { color: var(--warn); font-size: 13px; min-height: 1em; }
.chart-card { padding: 10px; display: grid; gap: 10px; min-width: 0; }
.chart-box { overflow-x: auto; background: var(--chart-paper); border-radius: 8px; }
.chart-box svg { display: block; width: 100%; height: auto; }
.chart-box svg { max-height: calc(100vh - 24px); margin: 0 auto; }
@media (max-width: 700px) {
  /* the chart runs edge to edge on a phone so the whole 盤 is as large as the screen allows */
  .chart-card { margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); border-radius: 0; border-left: 0; border-right: 0; padding: 8px 0; }
  .chart-card .tools, .chart-card .hint { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .chart-box { border-radius: 0; }
}
.rugua { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
.rugua .pair { display: flex; gap: 4px; align-items: center; min-width: 0; }
.rugua .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.rugua input.lab { width: 0; flex: 1 1 0; }
.rugua input.yr { width: 64px; flex: none; }
.shot { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.shot .box { background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px; display: grid; gap: 10px; max-width: 720px; width: 100%; max-height: 100%; overflow: auto; }
[hidden] { display: none !important; }
.shot img { width: 100%; height: auto; border: 1px solid var(--line); -webkit-touch-callout: default; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tools .sep { flex: 1; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { font: inherit; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.stepper input { width: 70px; text-align: center; }
.place-list { position: relative; }
.place-list ul { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px; list-style: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; max-height: 220px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
.place-list li { padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.place-list li:hover, .place-list li[aria-selected="true"] { background: var(--soft); }
.place-list li small { color: var(--muted); margin-left: 6px; }
.facts { font-size: 13px; color: var(--muted); line-height: 1.6; }
.facts b { color: var(--ink); font-weight: 600; }
.example { font-size: 12px; color: var(--accent); border: 1px dashed var(--accent); border-radius: 6px; padding: 2px 6px; }
@media (prefers-reduced-motion: no-preference) { .pill, .seg button, .go { transition: background .15s, color .15s; } }
</style>
</head><body>
<script>
/* ===== 文字設定: change any wording here (keep the quotes). ===== */
const WORDS = {
  title: "斗數起盤",            // big title at the top, and the browser tab
  subtitle: "網頁版",               // small grey words after the title (leave "" for none)
  sampleTag: "示例盤",              // tag shown while the sample chart is on
  sampleName: "示例",               // name on the sample chart (leave "" for none)
  chartHintPublic: "點一個宮，框出這個大運。",   // hint on the public site (no how-to)
  formHint: "有時間和地點時，用真太陽時定時辰。香港、中國、台灣等 +8 地區用官方農曆；其他地方用出生地農曆。斗數不用節氣：年干支跟農曆年，月干支用五虎遁。",
  goButton: "起盤",
};
/* ===== 顯示設定 ===== */
const SHOW = {
  marks: false,       // ○□△● on the chart (false = hidden)
  dayunYears: false,
  howTo: false,        // how-to words for dragging (public site: false)
  students: false,     // 入卦者遁干 + 顯示父母資料 (public site: false)
  traits: false,      // the bold digits in each 宮 (特質符號) (false = hidden)  // the ten 流年 years written in the 宮 when a 大運 is chosen (false = hidden)
};
</script>
<div class="wrap">
  <header class="top" style="grid-column: 1 / -1">
    <h1 id="wTitle">斗數起盤</h1>
    <span class="sub" id="wSub">網頁版</span>
  </header>

  <section class="card chart-card" aria-label="命盤">
    <div class="tools">
      <span class="stepper" aria-label="流年">
        <button type="button" id="curPrev" aria-label="上一年">‹</button>
        <input type="number" id="cur2" inputmode="numeric" aria-label="流年">
        <button type="button" id="curNext" aria-label="下一年">›</button>
      </span>
      <button type="button" class="pill" id="tNian" aria-pressed="false" hidden>流年四化</button>
      <button type="button" class="pill" id="tAll" aria-pressed="false">全部星曜</button>
      <button type="button" class="pill" id="tCs" aria-pressed="false">長生十二神</button>
      <button type="button" class="pill" id="tYears" aria-pressed="false">大限年份</button>
      <button type="button" class="pill" id="tParents" aria-pressed="true">顯示父母資料</button>
      <button type="button" class="pill" id="saveImg">存圖</button>
      <button type="button" class="pill" id="clearDrag">清除宮干</button>
      <span class="sep"></span>
      <span class="example" id="exampleTag">示例盤</span>
    </div>
    <div class="chart-box" id="chartBox"></div>
    <div class="err" id="dragMsg" role="status" style="color:#D2691E"></div>
    <p class="hint" id="wChartHint"></p>
  </section>

  <form class="card form-card" id="f" autocomplete="off">
    <div class="row">
      <label class="lbl" for="name">姓名</label>
      <input type="text" id="name" class="grow" placeholder="可留空">
      <div class="seg" role="group" aria-label="性別">
        <button type="button" id="male" aria-pressed="true">男</button><button type="button" id="female" aria-pressed="false">女</button>
      </div>
    </div>
    <div class="row">
      <label class="lbl">曆法</label>
      <div class="seg" role="group" aria-label="曆法">
        <button type="button" id="modeS" aria-pressed="true">西曆</button><button type="button" id="modeL" aria-pressed="false">農曆</button>
      </div>
    </div>
    <div class="row">
      <label class="lbl" for="y">日期</label>
      <input type="number" id="y" class="w-year" min="1900" max="2050" inputmode="numeric" aria-label="年">
      <span>年</span>
      <input type="number" id="m" class="w-small" min="1" max="12" inputmode="numeric" aria-label="月">
      <span>月</span>
      <button type="button" class="pill" id="leap" aria-pressed="false" hidden>閏</button>
      <input type="number" id="d" class="w-small" min="1" max="31" inputmode="numeric" aria-label="日">
      <span>日</span>
    </div>
    <div class="row">
      <label class="lbl" for="time">時間</label>
      <input type="text" id="time" class="w-time" placeholder="15:30" inputmode="numeric">
      <span class="hint">或</span>
      <label class="lbl" for="hour" style="width:auto">時辰</label>
      <select id="hour"></select>
    </div>
    <div class="row place-list">
      <label class="lbl" for="place">地點</label>
      <input type="text" id="place" class="grow" placeholder="香港 / London / 東京" role="combobox" aria-expanded="false" aria-controls="placeOpts">
      <ul id="placeOpts" role="listbox" hidden></ul>
    </div>
    <div class="row">
      <label class="lbl" for="lon">經度</label>
      <input type="text" id="lon" class="w-lon" inputmode="decimal">
      <label class="lbl" for="zone" style="width:auto">時區</label>
      <input type="text" id="zone" class="grow" placeholder="Asia/Hong_Kong 或 +8">
    </div>
    <div class="row">
      <label class="lbl" for="cur">流年</label>
      <input type="number" id="cur" class="w-year" min="1900" max="2100" inputmode="numeric">
    </div>
    <div class="row" style="align-items:start">
      <label class="lbl">入卦</label>
      <div class="rugua grow">
        <div class="pair"><span class="dot" style="background:#00A949"></span><input type="text" id="r0" class="lab" maxlength="3" placeholder="父" aria-label="入卦1 名稱"><input type="number" id="ry0" class="yr" placeholder="年" aria-label="入卦1 年份"></div>
        <div class="pair"><span class="dot" style="background:#DC143C"></span><input type="text" id="r1" class="lab" maxlength="3" placeholder="母" aria-label="入卦2 名稱"><input type="number" id="ry1" class="yr" placeholder="年" aria-label="入卦2 年份"></div>
        <div class="pair"><span class="dot" style="background:#84629E"></span><input type="text" id="r2" class="lab" maxlength="3" aria-label="入卦3 名稱"><input type="number" id="ry2" class="yr" placeholder="年" aria-label="入卦3 年份"></div>
        <div class="pair"><span class="dot" style="background:#6E6E6E"></span><input type="text" id="r3" class="lab" maxlength="3" aria-label="入卦4 名稱"><input type="number" id="ry3" class="yr" placeholder="年" aria-label="入卦4 年份"></div>
      </div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <div class="row"><button type="submit" class="go" id="go">起盤</button></div>
    <div class="facts" id="facts"></div>
    <p class="hint" id="wFormHint">有時間和地點時，用真太陽時定時辰（同見微一樣）。香港、中國、台灣等 +8 地區用官方農曆；其他地方用出生地農曆。斗數不用節氣：年干支跟農曆年，月干支用五虎遁。</p>
  </form>

</div>
<div class="shot" id="shot" hidden>
  <div class="box">
    <div class="row"><b style="flex:1">長按圖片 →「加至照片」</b><button type="button" class="go" id="shotShare" style="flex:none;font-size:15px;padding:6px 14px" hidden>儲存到照片</button><button type="button" class="pill" id="shotClose">關閉</button></div>
    <img id="shotImg" alt="命盤圖">
    <p class="hint">iPhone：長按上面的圖，選「加至照片」。電腦：右鍵「另存圖片」。</p>
  </div>
</div>
